name: Generate contribution snake

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=#22d3ee&color_dots=#0b1526,#3a1f7a,#6d3fe0,#2a8fe8,#22d3ee

      # give the transparent snake SVG a dark LAB OS background + border
      - name: Add background
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("dist/github-snake-dark.svg")
          s = p.read_text()
          bg = '<rect width="100%" height="100%" fill="#050b16"/><rect x="0.5" y="0.5" width="99.9%" height="99.9%" rx="6" fill="none" stroke="#22d3ee" stroke-opacity=".35"/>'
          s = re.sub(r"(<svg[^>]*>)", lambda m: m.group(1) + bg, s, count=1)
          p.write_text(s)
          PY

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
